{% if authorized %}<section class="panel"><details><summary>Authorized priority override (current {{ item.priority }})</summary><p>Higher configured levels go first; equal levels use first-come-first-served. This never overrides eligibility, safety or an existing reservation.</p>
<form method="post" action="{{ url_for('waiting.priority',kind=kind,request_id=request_id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Selected priority<select name="priority"><option value="0">0 - Standard</option>{% for level in item.priorities %}<option value="{{ level }}">{{ level }}</option>{% endfor %}</select></label><label>Mandatory justification<textarea name="reason" maxlength="2000" required></textarea></label><button class="button-secondary">Record and change priority</button></form></details></section>{% endif %}
