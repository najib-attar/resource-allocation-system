name: Shared-file regression (Linux)

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing web dependency
        run: python -m pip install Flask==3.1.3
      - name: Build authoritative backend
        run: python scripts/build_backend.py
      - name: Run Python, OS lock, CLI and Flask smoke tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and run existing C++ tests
        run: |
          g++ -std=c++17 -I. -Isrc $(find src -name '*.cpp' ! -name main.cpp) tests/*.cpp -o /tmp/allocation-tests
          /tmp/allocation-tests
