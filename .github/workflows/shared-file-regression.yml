name: Backend and PostgreSQL regression (Linux)

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ras_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ras_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/ras_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Build authoritative backend
        run: python scripts/build_backend.py
      - name: Run Python, PostgreSQL, gateway, CLI and Flask tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and run existing C++ tests
        run: |
          g++ -std=c++17 -I. -Isrc $(find src -name '*.cpp' ! -name main.cpp) tests/*.cpp -o /tmp/allocation-tests
          /tmp/allocation-tests
