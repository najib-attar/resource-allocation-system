name: Backend and PostgreSQL regression (Linux)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ras_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ras_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/ras_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Build authoritative backend
        run: python scripts/build_backend.py
      - name: Verify schema documentation matches models
        run: python scripts/generate_database_diagrams.py --check
      - name: Run Python, PostgreSQL, gateway, CLI and Flask tests
        env:
          POSTGRES_TEST_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and run existing C++ tests
        run: |
          g++ -std=c++17 -I. -Isrc $(find src -name '*.cpp' ! -name main.cpp) tests/*.cpp -o /tmp/allocation-tests
          /tmp/allocation-tests

  projection:
    name: I3b authorized read-only PostgreSQL projection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ubuntu:24.04
      options: --memory=3g --memory-swap=3g --cpus=2 --pids-limit=256
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ras_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --memory=1g --memory-swap=1g --cpus=2 --pids-limit=256
          --health-cmd "pg_isready -U postgres -d ras_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONTZPATH: ''
      TEST_DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/ras_test
      PROJECTION_PYTHON: /tmp/cdmcs-projection-python/bin/python
      RESOURCE_ALLOCATION_BACKEND: /tmp/cdmcs-projection-engine/allocation_system
    steps:
      - name: Install isolated test tools
        timeout-minutes: 5
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install --no-install-recommends -y \
            ca-certificates git g++ python3 python3-venv
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned application dependencies
        timeout-minutes: 3
        run: |
          python3 -m venv "${PROJECTION_PYTHON%/bin/python}"
          "$PROJECTION_PYTHON" -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build unchanged production engine for synthetic validation tests
        timeout-minutes: 5
        run: |
          "$PROJECTION_PYTHON" -B scripts/build_backend.py \
            --compiler g++ --output "$RESOURCE_ALLOCATION_BACKEND"
      - name: Require all projection and identity tests without skips
        timeout-minutes: 11
        run: |
          timeout --kill-after=5s 600s "$PROJECTION_PYTHON" -B - <<'PY'
          import sys
          import unittest
          suite = unittest.TestSuite()
          for path, pattern in [('research/cdmcs/i3b/tests', 'test_*.py'),
                                ('tests', 'test_identity_sessions.py')]:
              discovered = unittest.TestLoader().discover(path, pattern=pattern)
              if not discovered.countTestCases():
                  raise SystemExit('Projection verification requires both test groups')
              suite.addTests(discovered)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped:
              raise SystemExit('Projection verification requires nonempty discovery and zero skips')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Confirm tests left the checkout clean
        run: |
          status="$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
