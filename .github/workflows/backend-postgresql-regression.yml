name: Backend and PostgreSQL regression (Linux)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ras_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ras_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/ras_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Build authoritative backend
        run: python scripts/build_backend.py
      - name: Verify schema documentation matches models
        run: python scripts/generate_database_diagrams.py --check
      - name: Run Python, PostgreSQL, gateway, CLI and Flask tests
        env:
          POSTGRES_TEST_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and run existing C++ tests
        run: |
          g++ -std=c++17 -I. -Isrc $(find src -name '*.cpp' ! -name main.cpp) tests/*.cpp -o /tmp/allocation-tests
          /tmp/allocation-tests

  projection:
    name: I3b authorized read-only PostgreSQL projection
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ubuntu:24.04
      options: --memory=3g --memory-swap=3g --cpus=2 --pids-limit=256
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ras_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --memory=1g --memory-swap=1g --cpus=2 --pids-limit=256
          --health-cmd "pg_isready -U postgres -d ras_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONTZPATH: ''
      TEST_DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/ras_test
      PROJECTION_PYTHON: /tmp/cdmcs-projection-python/bin/python
      RESOURCE_ALLOCATION_BACKEND: /tmp/cdmcs-projection-engine/allocation_system
      CDMCS_I3A_BINARY: /tmp/cdmcs-shadow-release/cdmcs_i1
      CDMCS_I3A_PRODUCTION: /tmp/cdmcs-projection-engine/allocation_system
    steps:
      - name: Install isolated test tools
        timeout-minutes: 5
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install --no-install-recommends -y \
            ca-certificates curl bzip2 git cmake make g++ python3 python3-venv
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned application dependencies
        timeout-minutes: 3
        run: |
          python3 -m venv "${PROJECTION_PYTHON%/bin/python}"
          "$PROJECTION_PYTHON" -m pip install --disable-pip-version-check -r requirements.txt
      - name: Build unchanged production engine for synthetic validation tests
        timeout-minutes: 5
        run: |
          "$PROJECTION_PYTHON" -B scripts/build_backend.py \
            --compiler g++ --output "$RESOURCE_ALLOCATION_BACKEND"
      - name: Build and test pinned Release CDMCS for the actual shadow subprocess
        timeout-minutes: 8
        run: |
          deps=/tmp/cdmcs-shadow-deps
          mkdir -p "$deps"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
            https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.bz2 \
            --output "$deps/boost.tar.bz2"
          printf '%s  %s\n' \
            7009fe1faa1697476bdc7027703a2badb84e849b7b0baad5086b087b971f8617 \
            "$deps/boost.tar.bz2" | sha256sum --check --strict
          tar -xjf "$deps/boost.tar.bz2" -C "$deps" \
            boost_1_85_0/boost boost_1_85_0/LICENSE_1_0.txt
          cmake -S research/cdmcs/i1 -B "${CDMCS_I3A_BINARY%/*}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF -DBUILD_TESTING=ON \
            -DBOOST_JSON_INCLUDE_DIR="$deps/boost_1_85_0" \
            -DPython3_EXECUTABLE="$PROJECTION_PYTHON"
          cmake --build "${CDMCS_I3A_BINARY%/*}" --parallel 2
          ctest --test-dir "${CDMCS_I3A_BINARY%/*}" --no-tests=error \
            --output-on-failure --verbose --parallel 1 --timeout 300
          echo "CDMCS_I3A_SHA256=$(sha256sum "$CDMCS_I3A_BINARY" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Require all projection and identity tests without skips
        timeout-minutes: 11
        run: |
          timeout --kill-after=5s 600s "$PROJECTION_PYTHON" -B - <<'PY'
          import sys
          import unittest
          suite = unittest.TestSuite()
          for path, pattern in [('research/cdmcs/i3b/tests', 'test_*.py'),
                                ('tests', 'test_identity_sessions.py')]:
              discovered = unittest.TestLoader().discover(path, pattern=pattern)
              if not discovered.countTestCases():
                  raise SystemExit('Projection verification requires both test groups')
              suite.addTests(discovered)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped:
              raise SystemExit('Projection verification requires nonempty discovery and zero skips')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Require synthetic D1 contract, compiler and independent native score tests
        timeout-minutes: 6
        run: |
          # This is the pinned Release executable, not the instrumented ASan build.
          test -x "$CDMCS_I3A_BINARY"
          printf '%s  %s\n' "$CDMCS_I3A_SHA256" "$CDMCS_I3A_BINARY" | sha256sum --check --strict
          timeout --kill-after=5s 300s "$PROJECTION_PYTHON" -B - <<'PY'
          import sys
          import unittest
          suite = unittest.TestSuite()
          for pattern, minimum in [('test_contract.py', 26), ('test_compiler.py', 40),
                                   ('test_native_preferences.py', 18)]:
              discovered = unittest.TestLoader().discover('research/cdmcs/i3d/d1/tests', pattern=pattern)
              count = discovered.countTestCases()
              print(f'D1 {pattern}: {count} tests', flush=True)
              if count < minimum:
                  raise SystemExit('D1 requires every contract/compiler/native score test group')
              suite.addTests(discovered)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped:
              raise SystemExit('D1 requires nonempty discovery and zero skipped tests')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Require synthetic-only I3c security and native PostgreSQL shadow tests
        timeout-minutes: 8
        run: |
          # Release binary tested immediately above, not an ASan binary under RLIMIT_AS.
          test -x "$CDMCS_I3A_BINARY"
          printf '%s  %s\n' "$CDMCS_I3A_SHA256" "$CDMCS_I3A_BINARY" | sha256sum --check --strict
          timeout --kill-after=5s 420s "$PROJECTION_PYTHON" -B - <<'PY'
          import sys
          import unittest
          for pattern in ('test_shadow.py', 'test_release_review.py',
                          'test_native_shadow.py', 'test_projection_shadow.py'):
              discovered = unittest.TestLoader().discover('research/cdmcs/i3c/tests', pattern=pattern)
              if not discovered.countTestCases():
                  raise SystemExit('I3c requires each admission/process/native/database test group')
          suite = unittest.TestLoader().discover('research/cdmcs/i3c/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped:
              raise SystemExit('I3c requires nonempty discovery and zero skipped tests')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Require exact synthetic D2 batches, late-failure cleanup and independent native costs
        timeout-minutes: 8
        run: |
          # Correctness uses the pinned Release engine, never ASan under RLIMIT_AS.
          # The production binary is the existing builder's default configuration;
          # this gate makes no performance claim from that non-Release build.
          test -x "$CDMCS_I3A_BINARY"
          test -x "$CDMCS_I3A_PRODUCTION"
          printf '%s  %s\n' "$CDMCS_I3A_SHA256" "$CDMCS_I3A_BINARY" | sha256sum --check --strict
          timeout --kill-after=5s 420s "$PROJECTION_PYTHON" -B - <<'PY'
          import sys
          import unittest
          suite = unittest.TestSuite()
          for pattern, minimum in [('test_planning.py', 14), ('test_runner.py', 19),
                                   ('test_benchmark.py', 3), ('test_native_batching.py', 20)]:
              discovered = unittest.TestLoader().discover('research/cdmcs/i3d/d2/tests', pattern=pattern)
              count = discovered.countTestCases()
              print(f'D2 {pattern}: {count} tests', flush=True)
              if count < minimum:
                  raise SystemExit('D2 requires every planning/process/benchmark/native test group')
              suite.addTests(discovered)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped:
              raise SystemExit('D2 requires nonempty discovery and zero skipped tests')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Confirm tests left the checkout clean
        run: |
          status="$(git -c safe.directory="$GITHUB_WORKSPACE" status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
